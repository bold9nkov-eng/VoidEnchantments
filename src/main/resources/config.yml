    "1": ["#FF2337", "#FF7788", "#FFFFFF"]
    "2": ["#FF8719", "#FFD28A", "#FFFFFF"]
    "3": ["#A537FF", "#D5A5FF", "#FFFFFF"]
    "4": ["#23AAFF", "#BCEBFF", "#FFFFFF"]
