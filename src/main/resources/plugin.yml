name: VoidEnchantments
version: 3.1.0
main: ru.voidmain.enchants.VoidEnchantments
api-version: '1.21'
depend: [packetevents]
author: VoidMain
commands:
  voidenchants:
    aliases: [ve, enchants]
    description: Каталог и управление кастомными зачарованиями VoidMain
    usage: /enchants [list|info|apply] или /ve [help|give|giveall|remove|strip|book|adminbook|reload|debug|drops|admin]
permissions:
  voidenchants.admin:
    description: Доступ к административным командам и панели VoidEnchantments
    default: op
