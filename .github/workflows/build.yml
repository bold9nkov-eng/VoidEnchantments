name: Build VoidEnchantments
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Verify JAR
        run: test -f target/VoidEnchantments-2.1.2.jar
      - uses: actions/upload-artifact@v5
        with:
          name: VoidEnchantments-2.1.2
          path: target/VoidEnchantments-2.1.2.jar
          if-no-files-found: error
          retention-days: 30
